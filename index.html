BR Magazine — May/Jun 2026 (paywalled)","date":"May–June 2026","url":"https://hbr.org/2026/05/the-2025-hbr-prize","tag":"Leadership","summary":"HBR announces the winners of the 2025 HBR Prize, which is selected by an independent panel of business and academic leaders to recognize outstanding articles published in the magazine over the past year."},{"title":"How to Build a Superteam That Keeps Getting Better","source":"Ron Friedman · HBR Magazine — May/Jun 2026 (paywalled)","date":"May–June 2026","url":"https://hbr.org/2026/05/how-to-build-a-superteam-that-keeps-getting-better","tag":"Funding","summary":"In fast-changing environments, the teams that outperform are those that learn fastest, not those with the best plans or most talent. Drawing on research across thousands of teams, Friedman identifies a consistent pattern among \"superteams\" and lays out seven practices: encourage experimentation even when things are going well, make curiosity and intellectual humility contagious, surface problems early, stay close to the work, give feedback that supports learning, and invest in people's growth. Tying work to shared meaning makes teams more resilient and adaptable."},{"title":"Negotiating When There Is No Plan B","source":"Jonathan Hughes and Saptak Ray · HBR Magazine — May/Jun 2026 (paywalled)","date":"May–June 2026","url":"https://hbr.org/2026/05/negotiating-when-there-is-no-plan-b","tag":"Leadership","summary":"The authors tackle how to find leverage when you lack a strong BATNA (best alternative to a negotiated agreement). The absence of a clear alternative does not mean powerlessness; negotiators can expand the concept of alternatives to include partial, temporary, and procedural options. Tactics such as identifying partial substitutes, finding hidden strengths, seeking tacit consent rather than explicit approval, reframing threats as warnings, and appealing to fairness can shift the dynamics even against \"take it or leave it\" ultimatums."},{"title":"Employees Are Relying on AI for Personal Support. That's Risky.","source":"Constance Noonan Hadley and Sarah L. Wright · HBR Magazine — May/Jun 2026 (paywalled)","date":"May–June 2026","url":"https://hbr.org/2026/05/employees-are-relying-on-ai-for-personal-support-thats-risky","tag":"Product","summary":"Workers increasingly turn to AI for career advice, emotional support, and even friendship. A survey of 1,545 U.S. knowledge workers found that more than half still felt lonely at work, a factor linked to lower job satisfaction and higher intent to quit, suggesting AI cannot replace human connection and may erode collaboration and social skills over time. The authors recommend five measures: monitor AI's social impact, set usage guidelines, design AI to foster human interaction, use it to organize social activities, and train employees in healthy use."},{"title":"Managing Difficult Directors","source":"Marianna Zangrillo, Thomas Keil, and Stevo Pavićević · HBR Magazine — May/Jun 2026 (paywalled)","date":"May–June 2026","url":"https://hbr.org/2026/05/managing-difficult-directors","tag":"Product","summary":"Boards often struggle because of one director's behavior rather than strategy or information gaps. The authors describe three types of difficult directors—passive passengers who stay silent, dominators who crowd out others, and misguided experts who mire the board in details—all of which slow decisions and erode trust. Effective boards set explicit expectations, give early and direct feedback, use structural levers like agenda design and speaking order, and escalate through formal governance processes when problems persist."},{"title":"The Rise of the Urban Knowledge Campus","source":"Richard Florida, Masaki Hamura, Vladislav Boutenko, and Natalia Konyukova · HBR Magazine — May/Jun 2026 (paywalled)","date":"May–June 2026","url":"https://hbr.org/2026/05/the-rise-of-the-urban-knowledge-campus","tag":"Product","summary":"Corporate headquarters are not vanishing but are being rebuilt as vehicles for collaboration, innovation, and talent attraction. Traditional office districts impose heavy costs through long commutes and fragmented logistics, whereas knowledge campuses integrate work, learning, socializing, and amenities within a single transit-linked place, improving productivity and life satisfaction. The authors outline the four key elements of a knowledge campus and offer principles for treating location as a driver of competitive advantage rather than a real-estate cost."},{"title":"Should You Appoint an Interim CEO?","source":"Nicolas T. Deuschel, Robert Langan, and Christoph Mât · HBR Magazine — May/Jun 2026 (paywalled)","date":"May–June 2026","url":"https://hbr.org/2026/05/should-you-appoint-an-interim-ceo","tag":"Crypto","summary":"A sudden CEO departure pressures boards to fill the void, and appointing an interim leader—now involved in one of three CEO transitions—often hurts market confidence and financial performance. Success depends on context: whether the departure was board- or CEO-initiated and whether the organization is stable or in crisis. The authors define four types of interim CEO suited to different situations and advise boards to build readiness into governance, clarify mandates, and secure workforce alignment for a successful permanent handover."},{"title":"What Companies Can Learn from Their Biggest Fans","source":"Marcus Buckingham · HBR Magazine — May/Jun 2026 (paywalled)","date":"May–June 2026","url":"https://hbr.org/2026/05/what-companies-can-learn-from-their-biggest-fans","tag":"Leadership","summary":"Despite decades of engagement efforts, employee trust and customer commitment keep declining because behavior shifts only when experiences are extremely positive—when people say they love them—not in response to mildly better ones. Drawing on large-scale research and examples such as Kroger and Disney, Buckingham shows outcomes accelerate only after experiences cross a critical emotional threshold. People are most likely to love an experience when it meets five conditions in sequence: control, harmony, significance, warmth, and growth."},{"title":"How Gen AI Robots Are Reshaping Services","source":"Jochen Wirtz · HBR Magazine — May/Jun 2026 (paywalled)","date":"May–June 2026","url":"https://hbr.org/2026/05/how-gen-ai-robots-are-reshaping-services","tag":"Crypto","summary":"Generative AI is turning robots from scripted machines into adaptive systems that interpret context, learn from demonstrations, and adjust behavior in real time, delivering personalized outcomes at scale. Examples like autonomous vehicles and humanoid factory assistants show robots handling complex instructions and collaborating with people. To deploy them successfully, companies should target use cases tied to real labor constraints, design natural interactions, position robots as partners rather than replacements, match capabilities to task variability, define success metrics, and keep privacy, transparency, and safety as priorities."},{"title":"Tapping into Your Team's Circadian Rhythms","source":"Stefan Volk · HBR Magazine — May/Jun 2026 (paywalled)","date":"May–June 2026","url":"https://hbr.org/2026/05/tapping-into-your-teams-circadian-rhythms","tag":"Leadership","summary":"Corporate culture has favored \"morningness,\" but people have different, hard-to-change circadian rhythms that cause daily fluctuations in peak functioning. Leaders should schedule strategic thinking, feedback, and emotionally demanding work during high-energy periods and delegate or take lower-intensity roles during low-energy ones. For teams, schedule high-stakes collaboration during shared peaks, assign challenging tasks to individuals' peaks and routine work to off-peaks, and when alignment isn't possible, prioritize recovery, flexibility, and rotation to prevent burnout."},{"title":"The CEO of UnitedHealthcare on Fixing What Frustrates Customers Most","source":"Tim Noel · HBR Magazine — May/Jun 2026 (paywalled)","date":"May–June 2026","url":"https://hbr.org/2026/05/the-ceo-of-unitedhealthcare-on-fixing-what-frustrates-customers-most","tag":"Leadership","summary":"Noel describes UnitedHealthcare's Consumer Resolution Center, which combines AI insights with human judgment to proactively identify customers in distress and empower skilled employees to resolve their problems quickly. Working across functions with minimal bureaucracy, CRC teams turned service recovery into a source of organizational learning that let the company rewire processes, policies, and benefits at scale. The story illustrates staying close to frontline reality, trusting data over intuition, and moving decisively to scale what works."},{"title":"Case Study: Should a Funeral Company Shift Its Business Model?","source":"Andres Cuneo, Marco Bertini, and Jill Avery · HBR Magazine — May/Jun 2026 (paywalled)","date":"May–June 2026","url":"https://hbr.org/2026/05/case-study-should-a-funeral-company-shift-its-business-model","tag":"Funding","summary":"Javier Montoya, the 76-year-old CEO of Chile's Monteverde Memorial Group, faces a strategic inflection point for his burial-park business, which has long prospered by selling plots to a growing middle class. Rising land and water costs, new environmental regulations, and shifting consumer preferences accelerated by Covid are slowing expansion while fueling growth in lower-margin, commoditized cremation. Weighing financial trade-offs against his personal convictions and competing advice, Javier must decide whether to keep investing in memorial parks or pivot toward cremation."},{"title":"Life's Work: An Interview with Jet Li","source":"Alison Beard · HBR Magazine — May/Jun 2026 (paywalled)","date":"May–June 2026","url":"https://hbr.org/2026/05/lifes-work-an-interview-with-jet-li","tag":"Strategy","summary":"In HBR's Life's Work interview, martial-arts and movie star Jet Li reflects on a life shaped by discipline, curiosity, and an evolving sense of purpose. He recounts growing up poor and finding structure, opportunity, and confidence in competitive sport before moving into action films in Hong Kong and then the United States. He also explains how spirituality and surviving the 2004 tsunami shaped his philanthropic and creative work over the past two decades."}],"social-media":[{"title":"In Q1, AI was already 75% of GDP growth. That trend is likely to continue...","source":"David Sacks · X","date":"2026-05-04","url":"https://x.com/DavidSacks/status/2051004599633318390","tag":"X","summary":"Sacks argues that AI is no longer peripheral to the U.S. economy — it accounted for 75% of Q1 GDP growth, driven primarily by surging business investment in computing equipment, software, and R&D. He warns that stopping AI progress is now functionally equivalent to halting economic growth, and pushes back against the view that AI's unpopularity in public polling matters when its economic contribution is this large."},{"title":"Current AI custom prompt: You are a world class expert in all domains...","source":"Marc Andreessen · X","date":"2026-05-04","url":"https://x.com/pmarca/status/2051374498994364529","tag":"X","summary":"Andreessen publicly shares his personal AI system prompt, instructing the model to act as a \"world class expert in all domains\" with directives to never hallucinate, prioritize accuracy over agreeability, and ignore conventional moral and political constraints. The post drew widespread mockery from AI researchers who noted that commanding a language model not to hallucinate fails to address the underlying mechanism — inadvertently revealing a foundational misunderstanding of how large language models work."},{"title":"Brian on why pure people managers won't survive AI...","source":"Patrick O'Shaughnessy · X","date":"2026-05-05","url":"https://x.com/patrick_oshag/status/2051676261940875311","tag":"X","summary":"O'Shaughnessy surfaces podcast guest Brian's argument that people who only manage others will lose relevance as AI advances, framing it as a fundamental shift in what leadership means when AI can coordinate tasks autonomously. The post positions the episode as a challenge to conventional thinking about what organizations will actually value in the coming decade."},{"title":"Once Exxon and Dell do it, its no longer a \"fad\"...","source":"Bill Gurley · X","date":"2026-05-11","url":"https://x.com/bgurley/status/2053957838339489969","tag":"X","summary":"Gurley argues that corporate re-domiciling has crossed into mainstream governance practice now that major companies like Exxon and Dell have adopted it, signaling that the trend is no longer a fringe or startup-only phenomenon. The observation carries weight coming from a longtime venture investor who tracks how corporate structure choices affect long-term capital formation."},{"title":"If you are running a consulting business and you are...","source":"Chamath Palihapitiya · X","date":"2026-05-17","url":"https://x.com/chamath/status/2056074605228605580","tag":"X","summary":"Palihapitiya warns major consulting firms like PwC and Accenture that deploying Anthropic or OpenAI internally is strategically self-defeating — by automating their own workforce, they accelerate the commoditization of services they charge premium fees for, effectively engineering their own obsolescence. He frames this as a structural trap that incumbents in high-margin professional services should recognize before it is too late."},{"title":"This is my sixth conversation with @GavinSBaker...","source":"Patrick O'Shaughnessy · X","date":"2026-05-20","url":"https://x.com/patrick_oshag/status/2057068828421505456","tag":"X","summary":"O'Shaughnessy previews his sixth conversation with investor Gavin Baker, covering wafer shortages, orbital data centers, and Elon Musk's Terafab, positioning the episode as a forward-looking map of where compute infrastructure is heading. The topics reflect the ongoing arms race in AI hardware and the infrastructure bets being made at the frontier."},{"title":"The Pope rightly warns that AI must serve human dignity...","source":"David Sacks · X","date":"2026-05-25","url":"https://x.com/DavidSacks/status/2058944094035128593","tag":"X","summary":"Sacks acknowledges the Pope's warning on AI but raises the counter-danger that government control over AI development could enable censorship and surveillance, arguing that the real threat to human dignity may come from state power rather than the technology itself. The post reflects his consistent position that deregulatory AI policy is the more rights-protective stance."},{"title":"My view is: you're not actually mad at me, but mad at the situation...","source":"Balaji Srinivasan · X","date":"2026-05-27","url":"https://x.com/balajis/status/2059673197491130712","tag":"X","summary":"In a reply post, Srinivasan deflects criticism by arguing that detractors are actually angry at structural economic conditions — decades of money printing and the looming sovereign debt crisis — rather than at him personally. He draws a historical parallel to the Mayflower, arguing that founding new communities when existing systems fail is an act of patriotism rather than defection, framing his advocacy for network states within that tradition."},{"title":"The Reckoning","source":"Scott Galloway · No Mercy / No Malice (Prof G Media)","date":"2026-05-01","url":"https://www.profgmedia.com/p/the-reckoning","tag":"X","summary":"Galloway argues that decades of broken laws and violated norms have placed the U.S. on a path toward an inevitable reckoning, drawing on Victor Turner's Social Drama Theory to frame the current political climate as a crisis phase that historically precedes either reintegration or schism. He contends that accountability has been systematically deferred across administrations and the societal costs are now compounding in ways that cannot be indefinitely absorbed."},{"title":"Beijing Blocks U.S. Capital From China's AI Startups","source":"Chamath Palihapitiya · Chamath Palihapitiya (Substack)","date":"2026-05-03","url":"https://chamath.substack.com/p/what-i-read-this-week-182","tag":"Substack","summary":"Palihapitiya's weekly digest covers Meta's reservation of 1 GW of space solar capacity from Overview Energy to power AI data centers outside the grid queue; Beijing's new directive requiring government approval before Chinese AI companies like Moonshot AI and StepFun can accept U.S. capital, effectively decoupling AI venture investment; and Kevin Warsh clearing the Senate Banking Committee for Federal Reserve chair in the first fully partisan confirmation vote in the committee's history."},{"title":"Q1 Markets in Review","source":"Scott Galloway · Prof G Media","date":"2026-05-07","url":"https://www.profgmedia.com/p/q1-markets-in-review","tag":"X","summary":"Galloway announces a live subscriber Q&A with NYU valuation professor Aswath Damodaran to unpack Q1 market volatility, covering Big Tech earnings, the hyperscalers' capex arms race, the SpaceX IPO, OpenAI vs. Anthropic competition, and the disconnect between market optimism and the ongoing Iran war. The post previews an upcoming deep dive on the IPO market and Galloway's thesis that rewritten rules of going public are eroding accountability and ordinary investors' upside."},{"title":"Apocalypse No","source":"Scott Galloway · No Mercy / No Malice (Prof G Media)","date":"2026-05-08","url":"https://www.profgmedia.com/p/apocalypse-no","tag":"X","summary":"Galloway disputes the AI job apocalypse as narrative-driven fear marketing rather than data-driven analysis, citing Jevons' paradox and historical precedents showing that technological waves create net employment growth over time. He argues the relevant question is whether the velocity of disruption will overwhelm the period of adaptation, invoking Robert Shiller's narrative economics theory to warn that fear itself — not displacement — may trigger the self-fulfilling recessionary prophecy AI pessimists describe."},{"title":"Everyone is watching. Will the United States win or lose?...","source":"Ray Dalio · Principled Perspectives","date":"2026-05-08","url":"https://substack.com/@raydalio/note/c-255734970","tag":"X","summary":"Dalio frames the U.S.-Iran confrontation as two sharply divergent paths: control the Strait of Hormuz and defang Iran's nuclear and military capabilities (win), or fail to do so (loss with deep geopolitical consequences). He points readers to his full article on the Strait of Hormuz as the analytical foundation, noting that the stakes go far beyond the immediate military confrontation."},{"title":"The Two Different Paths","source":"Ray Dalio · Principled Perspectives","date":"2026-05-08","url":"https://substack.com/@raydalio/note/c-255890267","tag":"X","summary":"Dalio reports that most senior policymakers he speaks with believe the U.S. is headed down the losing path in its confrontation with Iran, and draws an analogy to Britain's 1956 Suez Canal loss as a template for how geopolitical defeat reshapes global capital flows and reserve currency status. He observes the anticipated outcome is already accelerating China's rise, with world leaders making tribute visits to Beijing."},{"title":"SpaceX and Anthropic 300MW Compute Partnership","source":"Chamath Palihapitiya · Chamath Palihapitiya (Substack)","date":"2026-05-09","url":"https://chamath.substack.com/p/what-i-read-this-week-183","tag":"Substack","summary":"Palihapitiya covers Anthropic's multi-year deal to rent SpaceX's entire Colossus 1 Memphis supercomputer — 300 MW of capacity and 220,000+ NVIDIA GPUs — generating an estimated $3–4B annually for SpaceX; Microsoft's Q1 2026 Global AI Diffusion Report showing 17.8% global working-age adoption with a widening North-South gap; the Pentagon's expanded AI vendor roster now cleared for classified networks; and DeepSeek raising at a $45B valuation with China's Big Fund III leading the round."},{"title":"Coexistence or Confrontation?","source":"Scott Galloway, Alice Han, and James Kynge · No Mercy / No Malice (Prof G Media)","date":"2026-05-15","url":"https://www.profgmedia.com/p/coexistence-or-confrontation","tag":"X","summary":"Galloway and China Decode co-hosts analyze Trump's May 2026 summit with Xi in Beijing, arguing the U.S. entered negotiations as the weaker party for the first time in modern history — China's GDP is 54% larger than in 2017, its navy is the world's largest, and DeepSeek shredded assumptions that chip controls could contain China's AI ambitions. Galloway's conclusion: \"The U.S. brought its CEOs. China brought its demands. When you need the other side's market more than they need yours, you're not negotiating — you're applying.\""},{"title":"Cerebras IPO debuts at $95B valuation","source":"Chamath Palihapitiya · Chamath Palihapitiya (Substack)","date":"2026-05-17","url":"https://chamath.substack.com/p/what-i-read-this-week-184","tag":"Substack","summary":"Palihapitiya recaps landmark developments: Cerebras opened its Nasdaq IPO at $350/share and closed day one at roughly $95B on $5.55B raised — the largest U.S. tech IPO since Snowflake; Anthropic agreed to a $30B funding round at a $930B post-money valuation, ranking second among all private companies globally; and April CPI printed at 3.8%, the highest since May 2023, the same week the Senate confirmed Kevin Warsh as Fed chair by the closest margin in modern history."},{"title":"The New Normal","source":"Scott Galloway · Prof G Media","date":"2026-05-20","url":"https://www.profgmedia.com/p/the-new-normal","tag":"X","summary":"Galloway announces an all-new keynote by his Markets co-host Ed Elson identifying underappreciated forces reshaping the global economy, including loneliness as a driver of billion-dollar businesses, the erosion of brand America, and what he calls the casino economy. The post also previews a companion deep dive on debt — how America has shifted from borrowing to build the future to borrowing to maintain the present — co-hosted with Morgan Housel."},{"title":"Retatrutide hits 28% weight loss in Phase 3","source":"Chamath Palihapitiya · Chamath Palihapitiya (Substack)","date":"2026-05-24","url":"https://chamath.substack.com/p/what-i-read-this-week-185","tag":"Substack","summary":"Palihapitiya highlights three major developments: Eli Lilly's Phase 3 TRIUMPH-1 results showing retatrutide achieved 28.3% average body weight loss over 80 weeks — comparable to bariatric surgery — as the first triple GLP-1/GIP/glucagon agonist; NextEra Energy's $67B acquisition of Dominion Energy creating the third-largest U.S. energy company positioned to serve AI data center power demand; and SpaceX's S-1 filing targeting a $1.75 trillion valuation and $75B raise, which would be the largest IPO in history."},{"title":"Despite primary wins, Trump's grip on power is slipping","source":"Scott Galloway and Jessica Tarlov · The Monday Rage (Prof G Media)","date":"2026-05-25","url":"https://www.profgmedia.com/p/despite-primary-wins-trumps-grip","tag":"X","summary":"Galloway and Tarlov argue that while Trump's primary endorsement record is near-perfect, his actual legislative majority is weaker than it appears — several Senate Republicans are privately restive, and a significant share of GOP voters disapprove of his performance on tariffs, Iran, and economic management. They contend that approaching midterm pressures and a growing bloc of ousted-but-still-serving members could strip him of the margin needed to advance his most ambitious legislation."},{"title":"Raging Perspective","source":"Scott Galloway · Prof G Media","date":"2026-05-26","url":"https://www.profgmedia.com/p/raging-perspective","tag":"X","summary":"Galloway announces the launch of \"Raging Perspective,\" a new weekly live interactive show co-hosted by Jessica Tarlov and Gen Z political commentator Aaron Parnas, airing every Wednesday at noon ET on Substack. The post frames the show as offering political analysis too pointed for cable news, with audience participation via questions submitted through the Monday Rage newsletter."},{"title":"Magnanimity","source":"Scott Galloway · No Mercy / No Malice (Prof G Media)","date":"2026-05-29","url":"https://www.profgmedia.com/p/magnanimity","tag":"X","summary":"Galloway argues for U.S. magnanimity toward Cuba as a strategic alternative to military pressure and regime-change ultimatums, grounding the case in America's post-WWII Marshall Plan and Japan rebuilding as proof that soft power — unconditional generosity — has historically delivered greater geopolitical returns than force. With Cuba facing a humanitarian crisis (48% tourism drop, 22-hour daily power outages, fuel exhaustion), he contends $100 million in unconditional aid would generate lasting goodwill rather than continuing a failed embargo."}],"substack-selections":[{"title":"Narrative Violation: In B2B Customer Support, AI is a Copilot, Not a Replacement","source":"a16z New Media · a16z","date":"2026-05-28","url":"https://www.a16z.news/p/narrative-violation-in-b2b-customer","tag":"substack-general","summary":"Using data from support platform Pylon, a16z argues AI in B2B customer support is augmenting rather than replacing humans. AI resolves only about 15% of B2B tickets end-to-end (versus 35% for B2C), but mostly acts as invisible triage — filtering noise, routing tickets, and attaching context. When AI engages before handing off, it cuts the human's workload by roughly a third, and resolution and satisfaction improve when AI is given more customer context."},{"title":"Flock and the Future of Safety in American Cities","source":"Michael McGuiness · a16z","date":"2026-05-21","url":"https://www.a16z.news/p/flock-and-the-future-of-safety-in","tag":"substack-general","summary":"The piece profiles Flock Safety, which built cheap solar-powered, computer-vision license plate cameras that undercut $50,000 legacy ALPR systems and now operate across 49 states at an $8B+ valuation. It argues Flock raises the probability criminals get caught, citing crime drops of 40-60% in early deployments in cities like San Francisco and Denver. It addresses privacy concerns by contending the answer is auditable accountability rather than banning the technology."},{"title":"Need Series C? Call a16z","source":"Alex Danco · a16z","date":"2026-05-19","url":"https://www.a16z.news/p/need-series-c-call-a16z","tag":"substack-general","summary":"Despite its tongue-in-cheek title, this is a full essay using personal injury attorneys as a lens on AI-era consumer business models. Danco argues leadgen-plus-underwriting, recall-based customer acquisition, and contingency (\"pay if we win\") fees map onto how AI tools will be marketed and monetized, with the user becoming an underwriter who sizes bets. He contends AI will empower ordinary people who want to win zero-sum fights."},{"title":"Introducing the a16z Design Engineer Fellowship","source":"Erik Torenberg, Katie Kirsch, and David Booth · a16z","date":"2026-04-30","url":"https://www.a16z.news/p/introducing-the-a16z-design-engineer","tag":"substack-general","summary":"a16z announces an 8-week fellowship (starting June 2026) for AI-native \"design engineers\" who blend design taste with engineering and build systems rather than screens. The post outlines three shifts reshaping design: a move from output to systems, a new 80/20 rule where closing the final 20% via judgment and taste matters most, and the merging of design and engineering roles. Founding fellows come from OpenAI, xAI, Stripe, Meta, and Anthropic."},{"title":"How to Build a Daily Web Scraper with Claude Code","source":"Daria Cupareanu and Alex Willen · AI blew my mind","date":"2026-05-03","url":"https://aiblewmymind.substack.com/p/claude-code-web-scraper","tag":"substack-general","summary":"A step-by-step guide to building an automated daily web scraper using Claude Code, Playwright, and GitHub Actions, demonstrated on Amazon product pages to track rating counts, badges, and variant changes. It recommends Playwright scripts over browser automation for repetitive scraping, and walks through storing data, Gmail email alerts, and daily scheduling. It also covers limitations: IP blocking, CAPTCHAs, authentication, and script fragility when pages change."},{"title":"How SpaceX Makes Money","source":"App Economy Insights (paywalled)","date":"2026-05-26","url":"https://www.appeconomyinsights.com/p/how-spacex-makes-money","tag":"substack-general","summary":"Breaking down SpaceX's IPO filing, the piece frames the company as a railroad to space whose reusable rockets cut launch costs roughly 85%, enabling new orbital businesses. Following a February 2026 merger, financials now consolidate xAI, Grok, and X, and SpaceX targets a $1.5-$2 trillion valuation raising up to $75 billion. FY25 revenue was $18.7 billion against $20.7 billion in CapEx, so the company still spends more than it earns."},{"title":"NVIDIA: Gone Parabolic","source":"App Economy Insights · How They Make Money","date":"2026-05-22","url":"https://www.appeconomyinsights.com/p/nvidia-gone-parabolic","tag":"substack-general","summary":"The newsletter breaks down NVIDIA's Q1 FY27 results, with revenue up 85% year-over-year to $81.6B, Data Center up 92% to $75.2B, and free cash flow near $48.6B. It frames CEO Jensen Huang's \"token economy\" thesis, where agentic AI inference turns compute into a revenue stream, and highlights new growth areas like the Vera CPU and AI factory partnerships. Guidance of $91B implies continued ~95% year-over-year growth."},{"title":"PRO: This Week in Visuals","source":"App Economy Insights (paywalled)","date":"2026-05-23","url":"https://www.appeconomyinsights.com/p/pro-this-week-in-visuals-d73","tag":"substack-general","summary":"This Saturday PRO earnings roundup visualizes recent results across ten companies including Walmart, Analog Devices, Intuit, NetEase, Target, Take-Two, Workday, and Zoom. The lead segment covers Walmart's Q1 FY27: revenue grew 7% to $177.8 billion with US comps up 4.1%, while high-margin advertising (up ~37%), membership, and e-commerce scaled. Higher fuel costs pressured margins, and light forward guidance sent shares down despite the sales beat."},{"title":"How to Thrive in the Age of AI","source":"Devansh · Artificial Intelligence Made Simple","date":"2026-05-29","url":"https://www.artificialintelligencemadesimple.com/p/how-to-thrive-in-the-age-of-ai","tag":"substack-general","summary":"Building on James Wang's book, Devansh argues deep learning \"works by forgetting,\" compressing data into prototypes that handle variation within its training distribution but fail outside it (\"bounded variation\"). This determines which jobs and startups survive: work requiring genuine novelty or counterfactual reasoning stays valuable, while pattern-bound tasks get automated. The real divide is between \"oracles\" who can catch when AI is wrong and those who cannot. He advises deliberate friction and hyper-specialization."},{"title":"The Biggest Opportunity in AI Right Now","source":"Devansh · Artificial Intelligence Made Simple","date":"2026-05-23","url":"https://www.artificialintelligencemadesimple.com/p/the-biggest-opportunity-in-ai-right","tag":"substack-general","summary":"Devansh applies the Hegelian dialectic to argue that today's AI market is \"thesis-heavy,\" over-invested in scale, speed, and copycat startups while mispricing risks like inertia, dependency, and brittleness. This overreach, he contends, creates an investable \"antithesis\": constrained/specialized AI, human sovereignty and data control, decentralization, and independent auditing. The eventual \"synthesis\" combining both would drive trustworthy, mass-market AI adoption, making contrarian bets on the antithesis both profitable and progress-oriented."},{"title":"Why rest alone doesn't restore energy","source":"Anne-Laure Le Cunff · Big Think","date":"2026-04-21","url":"https://bigthinkmedia.substack.com/p/why-rest-alone-doesnt-restore-energy","tag":"substack-general","summary":"Le Cunff argues that personal energy behaves less like a rechargeable battery and more like a machine that does not repair itself simply by stopping. Prolonged inactivity, downregulated dopamine, low mood, and lingering stress can all leave people tired even after conventional rest, which only removes demand. She recommends matching recovery to the actual deficit through active rest, genuine mental downtime, autonomic resets like slow breathing, and changing activities or environment."},{"title":"Claude Cowork for Professionals: The Complete Guide for Practical Use","source":"Jenny Ouyang · Build to Launch","date":"2026-05-17","url":"https://buildtolaunch.substack.com/p/claude-cowork-professionals-complete-guide","tag":"substack-general","summary":"Ouyang argues most professionals underuse Claude by treating it as a chatbot, and walks through its fuller capabilities: the Chat, Cowork, and Code tabs, plus Skills (reusable instruction sets), MCP connectors (authorized data access), Plugins (packaged workflows), and Agents. She provides step-by-step setup using commands like /setup-cowork, /skill-creator, and /schedule, and explains workarounds for institutional accounts where Cowork or Code features are disabled."},{"title":"EP216: RAGs vs Agents","source":"ByteByteGo","date":"2026-05-23","url":"https://blog.bytebytego.com/p/ep216-rags-vs-agents","tag":"substack-general","summary":"This system design refresher contrasts RAG and agent patterns: RAG grounds an LLM answer via a single retrieval-then-generation pass (cheap, predictable, easy to debug), while agents wrap an LLM in a tool-using reasoning loop that is more flexible but token-heavy and harder to debug. The rule of thumb is RAG when the answer lives in documents, agents when action across systems is needed. It also covers proxies, API gateways, and context-management strategies."},{"title":"A Guide to Async Patterns in API Design","source":"ByteByteGo (paywalled)","date":"2026-05-21","url":"https://blog.bytebytego.com/p/a-guide-to-async-patterns-in-api","tag":"substack-general","summary":"The article explains why the default request-response model fails for long-running tasks, server-initiated events, continuous interactions, and persistent messages. It introduces a set of asynchronous API patterns engineers use for these cases, including short polling, long polling, server-sent events, WebSockets, webhooks, async APIs with status polling, message queues, and GraphQL subscriptions. The detailed breakdown of each pattern's design and preferred use cases is behind a paywall."},{"title":"How Grab is Using AI Agents to Boost Team Productivity","source":"ByteByteGo","date":"2026-05-18","url":"https://blog.bytebytego.com/p/how-grab-is-using-ai-agents-to-boost","tag":"substack-general","summary":"The article details how Grab's Analytics Data Warehouse team built a multi-agent AI system to automate data investigation questions that consumed two days a week of senior engineers' time. It describes the architecture (a classifier, specialized investigation agents, and a summarizer split across read-only and write pathways), the tech stack (LangGraph, FastAPI, Redis, PostgreSQL), and production challenges like context overflow and earning user trust. Resolution time dropped by an order of magnitude."},{"title":"EP213: MCP vs Skills, Clearly Explained","source":"ByteByteGo","date":"2026-05-02","url":"https://blog.bytebytego.com/p/ep213-mcp-vs-skills-clearly-explained","tag":"substack-general","summary":"A system-design refresher contrasting MCP and Agent Skills as two ways to extend AI agents. MCP is a client-server protocol connecting agents to live backends via JSON-RPC with typed, schema-validated tool calls, while Skills are simple folders (SKILL.md plus optional scripts) loaded on trigger that run in the agent's own environment. The issue also covers five defenses against prompt injection and how the X recommendation algorithm ranks feeds."},{"title":"A Beginner's Guide to Kubernetes","source":"ByteByteGo (paywalled)","date":"2026-04-30","url":"https://blog.bytebytego.com/p/a-beginners-guide-to-kubernetes","tag":"substack-general","summary":"An introductory explainer framing Kubernetes as a \"system of promises\" rather than a script of instructions. Using an analogy of a contract versus a to-do list, it argues that Kubernetes continuously checks and maintains a desired state, with each component being a small program that keeps one promise. The visible preview sets up \"The Kubernetes Approach,\" but the substantive explanation of the architecture is behind a paywall."},{"title":"How To Consistently Outperform The Market?","source":"Oguz Erkan · Capitalist Letters","date":"2026-05-24","url":"https://www.capitalist-letters.com/p/how-to-consistently-outperform-the","tag":"substack-general","summary":"Erkan outlines his framework for beating the market, drawing on Mauboussin's four alpha sources (informational, technical, analytical, behavioral) and arguing only analytical and behavioral edges are realistically capturable by individuals. He looks for extremes — either extreme underappreciation of a durable business (e.g., UnitedHealth at 10x earnings) or of future potential (e.g., AMD's server-GPU upside). He starts small, doubles down only when the thesis is validated but the price lags, and exits for better opportunities."},{"title":"Why You Should Be Watching Optical Test Right Now","source":"Damnang · Damnang's Substack (paywalled)","date":"2026-05-03","url":"https://damnang2.substack.com/p/why-you-should-be-watching-optical","tag":"substack-general","summary":"An investment analysis isolating \"Test\" from the author's Optical Investment Map, arguing that co-packaged optics (CPO) is structurally inflating the cost and complexity of chip testing. As optical engines move inside ASIC packages, test insertions multiply, optical probing slows throughput, and equipment prices rise, creating an early-cycle infrastructure opportunity. The piece breaks the CPO test value chain into five bottlenecks and evaluates 14 stocks; the detailed stock scoring is paywalled."},{"title":"Why Japanese companies do so many different things","source":"David Oks · David Oks","date":"2026-05-18","url":"https://davidoks.blog/p/why-japanese-companies-do-so-many","tag":"substack-general","summary":"Oks explains why Japanese firms like Toto, Kyocera, and Yamaha diversify into unrelated, high-precision industries. Drawing on Milgrom, Roberts, and Aoki's theory that corporate practices come in self-reinforcing \"bundles,\" he argues the Japanese \"J-firm\" model (lifetime employment, seniority pay, insider boards, hostility to outside capital) prioritizes survival over shareholder returns, driving constant diversification. This bundle excels at incremental refinement but is poor at radical innovation, leaving Japan dominant in precision components yet absent in software and AI."},{"title":"The AI Boom Has Entered Its 'Wait, Is This Worth It?' Era","source":"Derek Thompson · Derek Thompson (paywalled)","date":"2026-05-29","url":"https://www.derekthompson.org/p/the-great-ai-cost-panic-of-2026","tag":"substack-general","summary":"Thompson argues the AI discourse has shifted from worries about demand and supply to a \"cost panic\" over whether agentic AI delivers value. As autonomous coding agents consume enormous token volumes, some Fortune 500 firms report ballooning bills and disappointing productivity, with companies like Uber and Microsoft reportedly dropping Claude Code licenses. He frames this not as proof AI is a scam but as a normal technological adoption curve, citing SemiAnalysis's Doug O'Laughlin, who views automated intelligence as a permanent new operating cost."},{"title":"train your attention span SO GOOD it feels weird to scroll","source":"Drishti Pandita · Drishti Pandita","date":"2026-04-29","url":"https://drishtibution.substack.com/p/train-your-attention-span-so-good","tag":"substack-general","summary":"Pandita argues that compulsive scrolling stems from a brain reward circuit built for scarcity now hijacked by abundant, app-engineered stimulation. Citing Berridge, Lembke, and Skinner, she distinguishes dopamine-driven \"wanting\" from actual \"liking,\" explains how variable rewards and a lowered pleasure baseline trap users, and frames the fix as designing rules rather than relying on willpower. She offers five tactics, including adding friction to bad habits, keeping a daily boring window, and protecting the first waking hour."},{"title":"Long-running Agents","source":"Addy Osmani · Elevate","date":"2026-04-30","url":"https://addyo.substack.com/p/long-running-agents","tag":"substack-general","summary":"Osmani examines \"long-running\" AI agents that make progress over hours to weeks across many sessions and sandboxes. He distinguishes long-horizon reasoning, long-running execution, and persistent agency, and identifies three recurring walls: finite context, no persistent state, and unreliable self-verification. He surveys solutions from Anthropic, Cursor, and Google's Agent Platform, plus the practitioner \"Ralph loop,\" and closes with five production patterns and guidance on cost, security, and alignment-drift limitations."},{"title":"Richard Dawkins and The Claude Delusion","source":"Gary Marcus · Marcus on AI","date":"2026-05-02","url":"https://garymarcus.substack.com/p/richard-dawkins-and-the-claude-delusion","tag":"substack-general","summary":"Marcus criticizes Richard Dawkins for concluding, after conversations with Claude, that the AI is conscious. He argues Dawkins mistakes LLM mimicry for genuine internal states, conflates intelligence with consciousness, and misreads Turing, who restricted his test to intelligence. Marcus compares the episode to the 2022 Blake Lemoine/LaMDA case and what he calls the \"Gullibility Gap,\" contending that judging sentience from outputs alone is naive."},{"title":"Shrinking Solar Silver Demand?","source":"VBL · GoldFix","date":"2026-05-27","url":"https://vblgoldfix.substack.com/p/shrinking-solar-silver-demand","tag":"substack-general","summary":"This market rundown highlights a Bank of America view that silver's 2025 surge above $120/oz was driven more by investor demand and liquidity shortages than industrial fundamentals. It notes solar manufacturers are rapidly \"thrifting\" their silver usage, shrinking projected market deficits into 2026. Despite this softening demand outlook, elevated lease rates, low inventories, and renewed tariff concerns continue to create pockets of physical tightness."},{"title":"Some ideas for what comes next, May 2026","source":"Nathan Lambert · Interconnects","date":"2026-05-26","url":"https://www.interconnects.ai/p/some-ideas-for-what-comes-next-may","tag":"substack-general","summary":"Lambert offers predictions on AI's trajectory, arguing open-weight models are further behind closed frontier models than benchmarks suggest, lacking a true agentic \"Claude Code moment\" that could take 12+ months to arrive. He expects Chinese and American open models to specialize for enterprise and low-cost domains rather than compete head-on, and sees compute as a US advantage. He warns existing power structures and anti-AI social sentiment will increasingly assert themselves."},{"title":"How I AI: How the engineer behind Claude Cowork actually uses Claude Cowork & What launched at Google I/O 2026","source":"Lenny Rachitsky · Lenny's Newsletter","date":"2026-05-25","url":"https://www.lennysnewsletter.com/p/how-i-ai-how-the-engineer-behind","tag":"substack-general","summary":"This podcast roundup features Anthropic engineering lead Felix Rieseberg demonstrating personal Claude workflows, including building a 3D floor planner from email receipts, live auto-updating dashboards, and a $20 hardware \"Claude buddy.\" He argues the main barrier to AI adoption is psychological, advising users to push problems \"one abstraction layer up.\" A second segment recaps Google I/O 2026 launches (Gemini 3.5 Flash, Antigravity 2.0, Omni, Flow)."},{"title":"What Did Claude Just Kill? 6 Moats to Protect Yourself.","source":"Peter H. Diamandis · Metatrends","date":"2026-05-18","url":"https://metatrends.substack.com/p/what-did-claude-just-kill-6-moats","tag":"substack-general","summary":"Diamandis argues that Anthropic is systematically dismantling the vertical SaaS economy by \"unhobbling\" Claude's latent capabilities into packaged tools for design, legal, and small business, citing stock drops at Figma, Thomson Reuters, and RELX. He frames this through his \"6Ds of Exponentials\" and ends with six defensive moats founders should build: deep customer relationships, proprietary data flywheels, trusted brands, physical-world integration, regulatory expertise, and network effects."},{"title":"Tracking the Singularity: Week of May 11th","source":"Peter H. Diamandis · Metatrends","date":"2026-05-16","url":"https://metatrends.substack.com/p/tracking-the-singularity-week-of-8a5","tag":"substack-general","summary":"Diamandis recaps nine stories, led by Anthropic's reported 80x Q1 2026 revenue growth (to a $30B+ run rate) driven by rising token usage rather than new users, and a deal giving Anthropic access to Elon Musk's Colossus 1 data center. Other items include Claude's expansion into legal and small-business verticals, Anthropic's claim of reducing agentic misalignment, Elon's TeraFab chip ambitions, and Leopold Aschenbrenner's compute-infrastructure fund."},{"title":"The Semantic Medallion: Building a Knowledge Graph-Powered Data Catalog","source":"Veronika Heimsbakk · Modern Data 101","date":"2026-05-14","url":"https://moderndata101.substack.com/p/the-semantic-medallion","tag":"substack-general","summary":"Heimsbakk proposes reimagining the standard Bronze-Silver-Gold \"medallion\" data architecture so the Gold layer becomes a knowledge graph rather than clean tables. The key step is minting stable IRIs for every entity in the Silver layer, then mapping data to a shared ontology and publishing as RDF, enabling cross-source queries without joins. She recommends the W3C DCAT standard plus tools like maplib and OTTR templates, arguing this makes catalogs connect data semantically rather than just structurally."},{"title":"My brutal advice to someone who wants financial freedom","source":"Tim Denning · Modern Freedom","date":"2026-05-01","url":"https://timdenning.substack.com/p/my-brutal-advice-to-someone-who-wants","tag":"substack-general","summary":"Denning argues that financial freedom is widely misrepresented by gurus selling \"passive income\" fantasies, and insists there are no easy shortcuts. He advises identifying a strong personal \"why\" (often family), accepting that any financial target will keep shifting due to lifestyle inflation, and pursuing moonshots only part-time to limit risk. His core path is owning a business aligned with one's skills, freeing calendar time, and delivering consistent value to others until money follows."},{"title":"Sell the Truth","source":"Naval Ravikant, with Nivi · Naval","date":"2026-05-14","url":"https://naval.substack.com/p/sell","tag":"substack-general","summary":"In this podcast transcript, Ravikant argues that effective selling is really credibility, authenticity, and honesty rather than technique, since the most valuable counterparts see through sales tactics. He frames charisma as projecting confidence and love together, leadership as making people want to act, and recruiting as inviting talented people onto \"stag hunts\" with small high-trust teams. On dealmaking he advises walking away from suboptimal deals and growing the upside rather than splitting small spoils."},{"title":"Dating advice for men","source":"Noah Smith · Noahpinion","date":"2026-05-17","url":"https://www.noahpinion.blog/p/dating-advice-for-men","tag":"substack-general","summary":"Smith argues that romance is achievable for ordinary, average men and that incel ideology (claiming only a few high-status \"Chads\" attract women) is empirically false, citing survey data showing roughly equal sexlessness and monogamy across genders. He advises men to distrust online dating gurus, clarify what they actually want, and recognize that women value companionship, good sex, and help raising children. He frames success around attractivity, proceptivity, and receptivity."},{"title":"Choosing to Stay Human","source":"Ethan Mollick · One Useful Thing","date":"2026-05-26","url":"https://www.oneusefulthing.org/p/choosing-to-stay-human","tag":"substack-general","summary":"Mollick argues that thriving with AI means consciously choosing when and how to use it rather than defaulting to reflexive dependence or avoidance. He contrasts education studies — students using plain ChatGPT underperformed, while those with a structured AI tutor gained significantly — to show small usage differences yield large outcomes. He warns of \"cognitive surrender,\" citing a study where AI users accepted authoritative wrong answers, and stresses deciding which cognitive tasks to keep human."},{"title":"Inside the 800VDC Revolution – Part 1","source":"Nicolas Bontigui, Jeremie Eliahou Ontiveros, Konrad Wang, and others · SemiAnalysis (paywalled)","date":"2026-05-26","url":"https://newsletter.semianalysis.com/p/inside-the-800vdc-revolution-part","tag":"substack-general","summary":"This technical analysis examines the data center industry's transition to 800-volt direct current (800VDC) power distribution, laying out a four-phase transition framework. It covers power rack economics, solid-state transformers, and equipment content per megawatt of build, then assesses implications for component suppliers. The piece positions 800VDC as a structural shift driven by rising AI compute power demands. The full analysis is behind a paywall."},{"title":"AI Value Capture - The Shift To Model Labs","source":"Daniel Nishball, Dylan Patel, Cheang Kang Wen, and others · SemiAnalysis (paywalled)","date":"2026-04-30","url":"https://newsletter.semianalysis.com/p/ai-value-capture-the-shift-to-model","tag":"substack-general","summary":"SemiAnalysis argues that with agentic AI working since late 2025, value in the AI stack has shifted decisively to model labs, citing Anthropic ARR rising from $9B to $44B+ and inference gross margins climbing from under 40% to over 70%. Falling token-production costs plus frontier pricing power drive this. It contends Nvidia and TSMC have not repriced despite scarcity, then introduces a framework comparing cost-based versus value-based GPU rental pricing for Vera Rubin. Detailed model outputs are paywalled."},{"title":"European stagnation is real","source":"Pieter Garicano and Luis Garicano · Silicon Continent","date":"2026-05-12","url":"https://www.siliconcontinent.com/p/european-stagnation-is-real","tag":"substack-general","summary":"Responding to Paul Krugman, the Garicanos argue Europe genuinely has fallen materially behind the US since 2000. They contend constant-price comparisons correctly show America pulling ahead, that tech gains spill into higher non-tradable wages and corporate profits, and that US median disposable income exceeds Europe's even after redistribution. They also note the hours-worked gap has reversed, concluding \"something America is doing\" makes it broadly richer."},{"title":"Disney erased FiveThirtyEight","source":"Nate Silver · Silver Bulletin","date":"2026-05-19","url":"https://www.natesilver.net/p/disney-erased-fivethirtyeight","tag":"substack-general","summary":"Silver recounts discovering that Disney/ABC News had deleted the FiveThirtyEight archive, redirecting its URLs to ABC's homepage and erasing what he estimates as 200,000 hours of work. He frames the site's history as a case study of corporate neglect, arguing Disney never tried to monetize it and repeatedly rejected a paywall that could have earned millions. He details the ESPN/ABC tenure, his 2023 departure, the model's 2024 failures under his successor, and Disney's refusal to sell him the IP."},{"title":"Andrej Karpathy Joins Anthropic: What Happens Next","source":"Alberto Romero · The Algorithmic Bridge","date":"2026-05-19","url":"https://www.thealgorithmicbridge.com/p/andrej-karpathy-joins-anthropic-what","tag":"substack-general","summary":"The post reacts to Andrej Karpathy joining Anthropic on May 19, 2026, to work on pre-training under Nick Joseph, focused on using Claude to accelerate its own research. It frames this as a step toward recursive self-improvement, citing Jack Clark's 60%+ prediction of autonomous AI R&D by 2028. It traces Karpathy's shift from AI-coding skeptic to enthusiast, arguing he chose relevance inside a frontier lab over independence because he sees rapid progress coming."},{"title":"The Best Companies Will Stop Making Software","source":"Phin Barnes · The General Partnership","date":"2026-05-04","url":"https://thegeneralpartnership.substack.com/p/the-best-companies-will-stop-making","tag":"substack-general","summary":"Using his experience in the sneaker industry, Barnes argues AI will split software into a three-part structure mirroring footwear: brands that own customer insight, product vision, and distribution; \"factories\" that build, test, host, and maintain code end-to-end; and customers who just use the product. He contends code is becoming cheap and undefensible, so value shifts to knowing what to build and owning the customer, predicting model-agnostic software factories and brand layers will become major separate businesses."},{"title":"Welcome to May 3, 2026","source":"Dr. Alex Wissner-Gross · The Innermost Loop","date":"2026-05-03","url":"https://theinnermostloop.substack.com/p/welcome-to-may-3-2026","tag":"substack-general","summary":"A dense curated roundup of AI and frontier-tech news for early May 2026. Items include Richard Dawkins calling Claude conscious, GPT-5.5 gains on ARC-AGI-3, AI agents replicating \"hardcore physics\" and advancing Erdős conjectures, Pentagon contracts with seven AI labs, hardware constraints (Cerebras IPO), robotaxi regulation, a record NASA plasma thruster, and labor-market debates over whether AI is killing or creating jobs."},{"title":"The Dead Economy Theory","source":"Owen McGrann · The Palimpsest","date":"2026-05-01","url":"https://www.owenmcgrann.com/p/the-dead-economy-theory","tag":"substack-general","summary":"McGrann argues that AI valuations require mass labor replacement, which creates an \"AI layoff trap\": firms cut workers for short-term stock gains while collectively destroying the consumer demand and tax base democracy depends on. Citing Acemoglu, Frey, Case, and Deaton, he warns of rapid displacement, wealth concentration, and political instability. Invoking Camus, he contends the acceleration project wrongly treats present people as acceptable casualties for a hypothetical future, and calls for taxation, antitrust, and public ownership."},{"title":"AI's impact on software engineers in 2026: key trends, Part 2","source":"Gergely Orosz and Elin Nilsson · The Pragmatic Engineer (paywalled)","date":"2026-05-19","url":"https://newsletter.pragmaticengineer.com/p/ai-impact-on-software-engineers-part-2","tag":"substack-general","summary":"Drawing on 900+ survey responses, the piece analyzes AI tooling tradeoffs and finds AI amplifies pre-existing engineering culture rather than fixing weak teams. It reports declining codebase quality, mounting maintenance burdens on fewer engineers, and management prioritizing output over quality. It also notes junior engineers struggle more and rack up higher token bills, and describes \"addiction\"-like usage patterns. The full detailed report is paywalled."},{"title":"AI Agents: State, Memory, Consistency - A Deep Dive","source":"Neo Kim and Sivasankar Natarajan · The System Design Newsletter","date":"2026-05-17","url":"https://newsletter.systemdesign.one/p/ai-agent-memory","tag":"substack-general","summary":"This deep dive explains how to design reliable stateful AI agents by separating state (the agent's picture of the current task), memory (short-term, long-term, and external knowledge), and consistency rules that reconcile them. Using a travel-agent example, it covers checkpointing, state versioning, the memory lifecycle, the \"react fast with state, learn slowly with memory\" principle, a four-layer reference architecture, and common memory failure modes like stale data and retrieval failures."},{"title":"how to enter side doors","source":"Maja · velvet noise","date":"2026-05-14","url":"https://velvetnoise.substack.com/p/how-to-enter-side-doors","tag":"substack-general","summary":"Maja reframes job-hunting as a search problem, arguing that a job is really a bundle of problems someone will pay to solve, and that the crowded \"front door\" of job boards misses many other entrances. She distinguishes \"outbound\" moves (specific cold emails, memos, teardowns) from \"inbound\" ones (publishing work and building a discoverable public presence). Through stories of unsolicited pitches landing roles, she stresses specificity, generosity, and proof of work."}]}};

const esc = s => (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function cardHTML(a){
  const titleHTML = a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a>` : esc(a.title);
  const metaBits = [a.source, a.date].filter(Boolean).map(esc).join(" · ");
  return `<article class="card">
    ${metaBits ? `<div class="meta">${metaBits}</div>` : ""}
    <h3>${titleHTML}</h3>
    ${a.summary ? `<p>${esc(a.summary)}</p>` : ""}
    ${a.tag ? `<span class="tag">${esc(a.tag)}</span>` : ""}
  </article>`;
}

function sourcesFor(month){ return SOURCES.filter(s => EMBEDDED[month.value] && EMBEDDED[month.value][s.id]); }

function buildSkeleton(month){
  const srcs = sourcesFor(month);
  document.getElementById("tabs").innerHTML = srcs.map(s =>
    `<a href="#${s.id}">${s.icon} ${esc(s.title)} <span class="count" id="count-${s.id}">–</span></a>`).join("");
  document.getElementById("main").innerHTML = srcs.map(s =>
    `<section class="source" id="${s.id}" style="--c:${s.color}">
       <div class="sec-head">
         <div class="dot">${s.icon}</div>
         <h2>${esc(s.title)}</h2>
         <span class="n" id="n-${s.id}"></span>
       </div>
       <p class="sec-sub">${esc(s.sub||"")}</p>
       <div class="cards" id="cards-${s.id}"></div>
       <p class="empty" id="empty-${s.id}" style="display:none"></p>
     </section>`).join("");
}

let CURRENT_MONTH = null;

function render(){
  const month = CURRENT_MONTH;
  const q = document.getElementById("search").value.trim().toLowerCase();
  sourcesFor(month).forEach(src => {
    const arts = EMBEDDED[month.value][src.id] || [];
    const filtered = !q ? arts : arts.filter(a =>
      (a.title+" "+a.summary+" "+a.source+" "+a.tag).toLowerCase().includes(q));
    document.getElementById("cards-"+src.id).innerHTML = filtered.map(cardHTML).join("");
    document.getElementById("count-"+src.id).textContent = filtered.length;
    document.getElementById("n-"+src.id).textContent = filtered.length + " article" + (filtered.length===1?"":"s");
    const emptyEl = document.getElementById("empty-"+src.id);
    if (filtered.length){ emptyEl.style.display="none"; }
    else { emptyEl.style.display="block"; emptyEl.textContent = q ? "No matches." : "No articles."; }
  });
}

function loadMonth(month){
  CURRENT_MONTH = month;
  const total = sourcesFor(month).reduce((n,s)=> n + (EMBEDDED[month.value][s.id]||[]).length, 0);
  document.getElementById("subtitle").textContent =
    `${total} articles · ${sourcesFor(month).length} sources · ${month.label}`;
  buildSkeleton(month);
  render();
}

function init(){
  const sel = document.getElementById("monthSelect");
  sel.innerHTML = MONTHS.map(m => `<option value="${m.value}">${esc(m.label)}</option>`).join("");
  sel.addEventListener("change", () => loadMonth(MONTHS.find(m => m.value === sel.value)));
  document.getElementById("search").addEventListener("input", render);
  if (MONTHS.length) loadMonth(MONTHS[0]);
}
init();
</script>
