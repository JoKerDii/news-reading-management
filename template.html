<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Newsletter Site</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1c2330; --muted:#697086;
    --line:#e6e8ee; --accent:#2b7de9; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.55;}
  a{color:inherit;text-decoration:none}

  header.site{background:linear-gradient(135deg,#0f1c33,#1c3a63);color:#fff;padding:34px 20px 26px;text-align:center}
  header.site h1{margin:0;font-size:30px;letter-spacing:-.5px}
  header.site p{margin:8px 0 0;color:#c5d3ea;font-size:15px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
  .controls select,.controls input{font-size:14px;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.12);color:#fff}
  .controls input::placeholder{color:#c5d3ea}
  .controls select option{color:#1c2330}

  nav.tabs{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;gap:6px;overflow-x:auto;padding:10px 14px;scrollbar-width:thin}
  nav.tabs a{white-space:nowrap;padding:8px 13px;border-radius:999px;font-size:14px;font-weight:600;
    color:var(--muted);border:1px solid var(--line);background:#fff;transition:.15s;display:flex;gap:7px;align-items:center}
  nav.tabs a:hover{color:var(--ink);border-color:var(--accent)}
  nav.tabs a .count{font-size:11px;background:#eef1f6;border-radius:999px;padding:1px 7px;color:var(--muted)}

  main{max-width:1040px;margin:0 auto;padding:26px 18px 60px}

  section.source{scroll-margin-top:64px;margin-bottom:40px}
  .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .sec-head .dot{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:20px;
    background:#fff;border:2px solid var(--c)}
  .sec-head h2{margin:0;font-size:21px}
  .sec-head .n{margin-left:auto;font-size:13px;color:var(--muted)}
  .sec-sub{margin:0 0 16px 50px;color:var(--muted);font-size:14px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
  article.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 16px 14px;border-top:3px solid var(--c);transition:.15s}
  article.card:hover{box-shadow:0 6px 22px rgba(20,30,50,.08);transform:translateY(-2px)}
  article.card .meta{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  article.card h3{margin:6px 0 6px;font-size:16px;line-height:1.35}
  article.card h3 a:hover{color:var(--accent)}
  article.card p{margin:0;font-size:14px;color:#444b5c}
  article.card .tag{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:999px;background:#eef1f6;color:var(--muted)}
  .empty{color:var(--muted);font-size:14px;margin:0 0 0 50px;font-style:italic}

  footer.site{text-align:center;color:var(--muted);font-size:13px;padding:28px 20px 40px;border-top:1px solid var(--line)}
  footer.site span{margin:0 8px}
</style>
</head>
<body>

<header class="site">
  <h1>🌐 Monthly Newsletter Site</h1>
  <p id="subtitle">Curated content · Updated monthly</p>
  <div class="controls">
    <select id="monthSelect" aria-label="Select month"></select>
    <input id="search" type="search" placeholder="🔍 Filter articles…">
  </div>
</header>

<nav class="tabs" id="tabs"></nav>
<main id="main"></main>

<footer class="site">
  <span>Gmail connector</span>·<span>Web search</span>·<span>Claude AI</span>·<span>Scheduled automation</span>
</footer>

<script>
/* ============================================================
   This file is GENERATED by build.js — do not edit by hand.
   To refresh after changing markdown files, re-run:  node build.js
   ============================================================ */
const MONTHS   = /*__MONTHS__*/[]/*__END__*/;
const SOURCES  = /*__SOURCES__*/[]/*__END__*/;
const EMBEDDED = /*__EMBEDDED__*/null/*__END__*/;

const esc = s => (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function cardHTML(a){
  const titleHTML = a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a>` : esc(a.title);
  const metaBits = [a.source, a.date].filter(Boolean).map(esc).join(" · ");
  return `<article class="card">
    ${metaBits ? `<div class="meta">${metaBits}</div>` : ""}
    <h3>${titleHTML}</h3>
    ${a.summary ? `<p>${esc(a.summary)}</p>` : ""}
    ${a.tag ? `<span class="tag">${esc(a.tag)}</span>` : ""}
  </article>`;
}

function sourcesFor(month){ return SOURCES.filter(s => EMBEDDED[month.value] && EMBEDDED[month.value][s.id]); }

function buildSkeleton(month){
  const srcs = sourcesFor(month);
  document.getElementById("tabs").innerHTML = srcs.map(s =>
    `<a href="#${s.id}">${s.icon} ${esc(s.title)} <span class="count" id="count-${s.id}">–</span></a>`).join("");
  document.getElementById("main").innerHTML = srcs.map(s =>
    `<section class="source" id="${s.id}" style="--c:${s.color}">
       <div class="sec-head">
         <div class="dot">${s.icon}</div>
         <h2>${esc(s.title)}</h2>
         <span class="n" id="n-${s.id}"></span>
       </div>
       <p class="sec-sub">${esc(s.sub||"")}</p>
       <div class="cards" id="cards-${s.id}"></div>
       <p class="empty" id="empty-${s.id}" style="display:none"></p>
     </section>`).join("");
}

let CURRENT_MONTH = null;

function render(){
  const month = CURRENT_MONTH;
  const q = document.getElementById("search").value.trim().toLowerCase();
  sourcesFor(month).forEach(src => {
    const arts = EMBEDDED[month.value][src.id] || [];
    const filtered = !q ? arts : arts.filter(a =>
      (a.title+" "+a.summary+" "+a.source+" "+a.tag).toLowerCase().includes(q));
    document.getElementById("cards-"+src.id).innerHTML = filtered.map(cardHTML).join("");
    document.getElementById("count-"+src.id).textContent = filtered.length;
    document.getElementById("n-"+src.id).textContent = filtered.length + " article" + (filtered.length===1?"":"s");
    const emptyEl = document.getElementById("empty-"+src.id);
    if (filtered.length){ emptyEl.style.display="none"; }
    else { emptyEl.style.display="block"; emptyEl.textContent = q ? "No matches." : "No articles."; }
  });
}

function loadMonth(month){
  CURRENT_MONTH = month;
  const total = sourcesFor(month).reduce((n,s)=> n + (EMBEDDED[month.value][s.id]||[]).length, 0);
  document.getElementById("subtitle").textContent =
    `${total} articles · ${sourcesFor(month).length} sources · ${month.label}`;
  buildSkeleton(month);
  render();
}

function init(){
  const sel = document.getElementById("monthSelect");
  sel.innerHTML = MONTHS.map(m => `<option value="${m.value}">${esc(m.label)}</option>`).join("");
  sel.addEventListener("change", () => loadMonth(MONTHS.find(m => m.value === sel.value)));
  document.getElementById("search").addEventListener("input", render);
  if (MONTHS.length) loadMonth(MONTHS[0]);
}
init();
</script>
</body>
</html>
